<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pid1.top</title>
  <meta name="description" content="pid1.top — coming soon." />
  <style>
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #16203a 0%, var(--bg) 60%);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .card { max-width: 640px; }
    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
    }
    .accent { color: var(--accent); }
    p { color: var(--muted); font-size: clamp(1rem, 2.5vw, 1.25rem); line-height: 1.6; }
    .pill {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.5rem 1.25rem;
      border: 1px solid #30363d;
      border-radius: 999px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .extension-note { margin-top: 2rem; font-size: 0.95rem; }
    footer { margin-top: 3rem; color: #586069; font-size: 0.8rem; }
    a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>pid1<span class="accent">.top</span></h1>
    <p>Something is being built here. Check back soon.</p>
    <span class="pill">🚧 Under construction</span>
    <p class="extension-note">
      Looking for <strong>The CSV Sheet Show</strong> extension for Visual Studio Code?
      <br />
      Get it on the
      <a href="https://marketplace.visualstudio.com/items?itemName=reyesr.csv-sheet-show">VS Code Marketplace</a>,
      <br/>or browse the
      <a href="https://github.com/reyesr/the-csv-sheet-show">source code on GitHub</a>.
    </p>
    <footer>Hosted on GitHub Pages</footer>
  </main>
</body>
</html>
